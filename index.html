<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Pingochat</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="dark">
    <div id="auth" class="auth">
        <h2>Pingochat</h2>

        <input id="phone" placeholder="Teléfono (3367xxxxx)" />
        <input id="password" type="password" placeholder="Contraseña" />

        <button id="login">Entrar</button>
        <button id="register">Registrarse</button>

        <p id="authMsg"></p>
    </div>

    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h1>Pingochat</h1>
            <nav>
                <button class="tab active" data-tab="chats"><i class="fa-solid fa-comments"></i> Chats</button>
                <button class="tab" data-tab="estados"><i class="fa-solid fa-circle-notch"></i> Estados</button>
                <button class="tab" data-tab="comunidades"><i class="fa-solid fa-users"></i> Comunidades</button>
                <button class="tab" data-tab="canales"><i class="fa-solid fa-bullhorn"></i> Canales</button>
                <button class="tab" data-tab="archivados"><i class="fa-solid fa-box-archive"></i> Archivados</button>
            </nav>
        </aside>


        <!-- MAIN -->
        <main class="main">
            <header class="chat-header">
                <span id="chatTitle">Chats</span>
                <input type="text" placeholder="Buscar..." />
            </header>


            <section id="content" class="content chats">
                <div id="messages" class="messages"></div>
            </section>


            <footer class="input-bar">
                <i class="fa-regular fa-face-smile"></i>
                <input id="messageInput" type="text" placeholder="Escribe un mensaje" />
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </footer>
        </main>
    </div>


    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
